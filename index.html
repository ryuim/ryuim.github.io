<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>MUKU</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    body { background-color: #000; color: white; margin: 0; overflow: hidden; user-select: none; touch-action: none; }
    
    .eye { transition: all 0.7s ease-in-out; background-color: #f59e0b; border-radius: 50%; }
    .mouth { transition: all 0.7s ease-in-out; stroke: #f59e0b; fill: transparent; stroke-width: 3; stroke-linecap: round; }
    
    .eye-normal { width: 48px; height: 48px; }
    .eye-relax { width: 48px; height: 12px; margin-top: 18px; }
    .eye-attention { width: 64px; height: 64px; }
    .eye-sleepy { width: 48px; height: 4px; margin-top: 24px; opacity: 0.3; background-color: #b45309; }
    .eye-happy { width: 48px; height: 24px; border-radius: 48px 48px 0 0; margin-top: 12px; }
    
    .eye-blink-closed { width: 48px; height: 4px; margin-top: 22px; transition: all 0.1s !important; }
    .eye-blink-open { width: 48px; height: 48px; transition: all 0.1s !important; }
  </style>
</head>
<body class="h-screen w-screen flex items-center justify-center relative">

  <button id="start-btn" class="px-4 py-2 border border-amber-500 text-amber-500 rounded-full hover:bg-amber-500 hover:text-black transition flex items-center justify-center z-10">
    ムクを起こす
  </button>

  <div id="muku-face" class="hidden flex-col items-center justify-center gap-8 w-full h-full">
    <div class="flex gap-14">
      <div class="flex items-center justify-center w-12 h-12"><div id="eye-l" class="eye eye-normal"></div></div>
      <div class="flex items-center justify-center w-12 h-12"><div id="eye-r" class="eye eye-normal"></div></div>
    </div>
    <svg width="60" height="30" viewBox="0 0 40 20" class="opacity-70">
      <path id="mouth" class="mouth" d="M 5 5 Q 12 15 20 5 Q 28 15 35 5" />
    </svg>
  </div>

  <!-- 充電中アイコン（充電時に自動で左上に表示） -->
  <div id="charging-indicator" style="display: none;" class="absolute top-4 left-4 text-amber-500/80 bg-neutral-900/60 p-2.5 rounded-full border border-amber-500/30 backdrop-blur-sm z-30 flex items-center justify-center">
    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
      <polygon points="13 2 3 14 12 14 11 22 21 10 12 10 13 2"></polygon>
    </svg>
  </div>

  <!-- 画面下部のマイクアイコン -->
  <button id="mic-settings-btn" style="display: none;" class="absolute bottom-6 left-1/2 -translate-x-1/2 text-amber-500/60 hover:text-amber-500 transition p-3 z-30 bg-neutral-900/50 rounded-full border border-amber-500/20 backdrop-blur-sm">
    <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <path d="M12 1a3 3 0 0 0-3 3v8a3 3 0 0 0 6 0V4a3 3 0 0 0-3-3z"></path>
      <path d="M19 10v1a7 7 0 0 1-14 0v-1"></path>
      <line x1="12" y1="19" x2="12" y2="23"></line>
      <line x1="8" y1="23" x2="16" y2="23"></line>
    </svg>
  </button>

  <!-- 感度調整モーダル -->
  <div id="settings-modal" style="display: none;" class="absolute inset-0 bg-black/80 backdrop-blur-sm items-center justify-center z-40">
    <div class="bg-neutral-900 border border-amber-500/30 p-6 rounded-2xl w-80 text-center flex flex-col gap-4 shadow-2xl">
      <h3 class="text-amber-500 font-bold text-lg">マイク感度調整</h3>
      <div class="flex flex-col gap-2">
        <label for="threshold-slider" class="text-sm text-gray-300">しきい値: <span id="threshold-val">140</span></label>
        <input id="threshold-slider" type="range" min="50" max="255" value="140" class="accent-amber-500 cursor-pointer">
        <div class="flex justify-between text-xs text-gray-400 px-1">
          <span>低（敏感）</span>
          <span>高（鈍感）</span>
        </div>
      </div>
      <button id="close-modal-btn" class="mt-2 py-2 bg-amber-500 text-black font-bold rounded-xl hover:bg-amber-400 transition">
        閉じる
      </button>
    </div>
  </div>

  <script>
    const startBtn = document.getElementById('start-btn');
    const face = document.getElementById('muku-face');
    const eyeL = document.getElementById('eye-l');
    const eyeR = document.getElementById('eye-r');
    const mouth = document.getElementById('mouth');
    const micSettingsBtn = document.getElementById('mic-settings-btn');
    const settingsModal = document.getElementById('settings-modal');
    const thresholdSlider = document.getElementById('threshold-slider');
    const thresholdVal = document.getElementById('threshold-val');
    const closeModalBtn = document.getElementById('close-modal-btn');
    const chargingIndicator = document.getElementById('charging-indicator');

    let currentEmotion = 'normal';
    let globalAudioContext = null;
    let purrOscillator = null;
    let lfoOscillator = null; 
    let lfoGainNode = null; 
    let masterGain = null;
    let isPlayingSound = false;
    let isPurring = false;
    let lastAttentionTime = 0;

    // --- ローカルストレージから保存されたしきい値を読み込み ---
    let soundThreshold = 140;
    const savedThreshold = localStorage.getItem('muku_threshold');
    if (savedThreshold !== null) {
      soundThreshold = Number(savedThreshold);
    }
    thresholdSlider.value = soundThreshold;
    thresholdVal.textContent = soundThreshold;

    micSettingsBtn.addEventListener('click', () => {
      settingsModal.style.display = 'flex';
    });
    closeModalBtn.addEventListener('click', () => {
      settingsModal.style.display = 'none';
    });

    // --- スライダー操作時に値を更新し、localStorageに保存 ---
    thresholdSlider.addEventListener('input', (e) => {
      soundThreshold = Number(e.target.value);
      thresholdVal.textContent = soundThreshold;
      localStorage.setItem('muku_threshold', soundThreshold);
    });

    // --- 単発の可愛い鳴き声関数 ---
    async function playCuteSound() {
      if (!globalAudioContext || isPlayingSound) return;
      isPlayingSound = true;

      if (globalAudioContext.state === 'suspended') {
        await globalAudioContext.resume();
      }

      const audioCtx = globalAudioContext;
      const oscillator = audioCtx.createOscillator();
      const gainNode = audioCtx.createGain();

      oscillator.type = 'sine';
      const now = audioCtx.currentTime;

      oscillator.frequency.setValueAtTime(1200, now);
      oscillator.frequency.exponentialRampToValueAtTime(600, now + 0.28);

      gainNode.gain.setValueAtTime(0, now);
      gainNode.gain.linearRampToValueAtTime(0.3, now + 0.02);
      gainNode.gain.exponentialRampToValueAtTime(0.0001, now + 0.2);

      oscillator.connect(gainNode);
      gainNode.connect(audioCtx.destination);

      oscillator.start(now);
      oscillator.stop(now + 0.21);

      setTimeout(() => {
        isPlayingSound = false;
      }, 500);
    }

    function setEmotion(emotion) {
      if (currentEmotion === emotion) return;
      
      if (emotion === 'attention') {
        playCuteSound();
      }

      currentEmotion = emotion;

      eyeL.className = `eye eye-${emotion}`;
      eyeR.className = `eye eye-${emotion}`;

      if (emotion === 'relax') {
        mouth.setAttribute('d', 'M 5 10 Q 12 15 20 10 Q 28 15 35 10');
      } else if (emotion === 'happy') {
        mouth.setAttribute('d', 'M 5 5 Q 20 20 35 5');
      } else {
        mouth.setAttribute('d', 'M 5 5 Q 12 15 20 5 Q 28 15 35 5');
      }
    }

    // --- ゴロゴロ音 ---
    function startPurr() {
      if (!globalAudioContext || purrOscillator) return;
      
      isPurring = true;
      const now = globalAudioContext.currentTime;

      purrOscillator = globalAudioContext.createOscillator();
      purrOscillator.type = 'sawtooth';
      purrOscillator.frequency.value = 20;

      const purrGain = globalAudioContext.createGain();
      purrGain.gain.value = 0.5;

      masterGain = globalAudioContext.createGain();
      masterGain.gain.setValueAtTime(0, now);
      masterGain.gain.linearRampToValueAtTime(1, now + 0.1);

      const filter = globalAudioContext.createBiquadFilter();
      filter.type = 'lowpass';
      filter.frequency.value = 180; 

      lfoOscillator = globalAudioContext.createOscillator();
      lfoOscillator.type = 'sine';
      lfoOscillator.frequency.value = 1.0; 

      lfoGainNode = globalAudioContext.createGain();
      lfoGainNode.gain.setValueAtTime(0, now);
      lfoGainNode.gain.linearRampToValueAtTime(0.4, now + 0.5); 

      lfoOscillator.connect(lfoGainNode);
      lfoGainNode.connect(purrGain.gain);

      purrOscillator.connect(filter);
      filter.connect(purrGain);
      purrGain.connect(masterGain);
      masterGain.connect(globalAudioContext.destination);

      purrOscillator.start(now);
      lfoOscillator.start(now);
    }

    function stopPurr() {
      if (masterGain && purrOscillator && lfoGainNode) {
        const now = globalAudioContext.currentTime;
        const lfoFadeOutTime = 1.5;    
        const masterFadeOutTime = 1.0; 
        const totalFadeOutTime = lfoFadeOutTime + masterFadeOutTime;
        
        lfoGainNode.gain.cancelScheduledValues(now);
        lfoGainNode.gain.setValueAtTime(lfoGainNode.gain.value, now);
        lfoGainNode.gain.linearRampToValueAtTime(0, now + lfoFadeOutTime);

        masterGain.gain.cancelScheduledValues(now);
        masterGain.gain.setValueAtTime(masterGain.gain.value, now); 
        masterGain.gain.setValueAtTime(masterGain.gain.value, now + lfoFadeOutTime);
        masterGain.gain.linearRampToValueAtTime(0, now + totalFadeOutTime);
        
        const oldPurrOsc = purrOscillator;
        const oldLfoOsc = lfoOscillator;
        const oldMasterGain = masterGain;
        const oldLfoGain = lfoGainNode;

        oldPurrOsc.stop(now + totalFadeOutTime);
        if (oldLfoOsc) oldLfoOsc.stop(now + totalFadeOutTime);
        
        purrOscillator = null;
        lfoOscillator = null;
        masterGain = null;
        lfoGainNode = null;

        setTimeout(() => {
          if (oldPurrOsc) oldPurrOsc.disconnect();
          if (oldLfoOsc) oldLfoOsc.disconnect();
          if (oldMasterGain) oldMasterGain.disconnect();
          if (oldLfoGain) oldLfoGain.disconnect();
          isPurring = false;
        }, (totalFadeOutTime + 0.1) * 1000);
      } else {
        isPurring = false;
      }
    }

    // --- 撫でるアクションの判定（25回以上でぐるる） ---
    let moveCount = 0;
    let petTimer = null;
    let lastEventTime = 0;
    let hasPlayedPurrSound = false;

    function handlePet(e) {
      const now = Date.now();
      
      if (now - lastEventTime < 30) return;
      lastEventTime = now;

      moveCount++;

      if (moveCount >= 2 && currentEmotion !== 'happy') {
        setEmotion('happy');
      }

      if (moveCount >= 25) {
        if (!hasPlayedPurrSound) {
          playCuteSound();
          hasPlayedPurrSound = true;
        }
        startPurr();
      }

      clearTimeout(petTimer);
      petTimer = setTimeout(() => {
        if (currentEmotion === 'happy') {
          setEmotion('normal');
        }
        stopPurr();
        moveCount = 0;
        hasPlayedPurrSound = false;
      }, 1000);
    }

    face.addEventListener('touchmove', handlePet, { passive: true });
    face.addEventListener('mousemove', handlePet);

    // --- 起床時のパチクリ ---
    let isBlinking = false;
    function playWakeUpBlink() {
      if (isBlinking) return;
      isBlinking = true;
      let count = 0;
      const blinkInterval = setInterval(() => {
        if (count % 2 === 0) {
          eyeL.className = 'eye eye-blink-closed';
          eyeR.className = 'eye eye-blink-closed';
        } else {
          eyeL.className = 'eye eye-blink-open';
          eyeR.className = 'eye eye-blink-open';
        }
        count++;
        
        if (count >= 4) { 
          clearInterval(blinkInterval);
          setTimeout(() => {
            eyeL.className = `eye eye-${currentEmotion}`;
            eyeR.className = `eye eye-${currentEmotion}`;
            isBlinking = false;
          }, 150);
        }
      }, 150);
    }

    // --- 初期化処理 ---
    startBtn.addEventListener('click', async () => {
      startBtn.style.display = 'none';
      face.style.display = 'flex';
      micSettingsBtn.style.display = 'block';

      try {
        globalAudioContext = new (window.AudioContext || window.webkitAudioContext)();
        if (globalAudioContext.state === 'suspended') {
          await globalAudioContext.resume();
        }

        playWakeUpBlink();
        playCuteSound();
        setTimeout(() => {
          playCuteSound();
        }, 400);

        let battery = null;
        if ('getBattery' in navigator) {
          try {
            battery = await navigator.getBattery();
          } catch(e) {}
        }

        const stream = await navigator.mediaDevices.getUserMedia({ 
          audio: { echoCancellation: true, noiseSuppression: true } 
        });
        
        const analyser = globalAudioContext.createAnalyser();
        const microphone = globalAudioContext.createMediaStreamSource(stream);
        
        microphone.connect(analyser);
        analyser.fftSize = 256;
        const dataArray = new Uint8Array(analyser.frequencyBinCount);

        setInterval(() => {
          if (battery && battery.charging) {
            chargingIndicator.style.display = 'flex';
          } else {
            chargingIndicator.style.display = 'none';
          }

          if (isPlayingSound || isPurring || currentEmotion === 'happy') return;

          analyser.getByteFrequencyData(dataArray);
          const volume = Math.max(...dataArray);

          const nowTime = Date.now();
          if (volume > soundThreshold && (nowTime - lastAttentionTime > 8000)) {
            lastAttentionTime = nowTime;
            setEmotion('attention');
            setTimeout(() => { 
              if(currentEmotion === 'attention') setEmotion('normal'); 
            }, 3000);
          } else if (currentEmotion !== 'attention') {
            const hour = new Date().getHours();
            if (battery && battery.charging) {
              setEmotion('relax');
            } else if (battery && battery.level <= 0.2 && !battery.charging) {
              setEmotion('sleepy');
            } else if (hour >= 23 || hour < 5) {
              setEmotion('sleepy');
            } else if (currentEmotion !== 'normal' && volume <= soundThreshold) {
              setEmotion('normal');
            }
          }
        }, 1000);

      } catch (err) {
        console.error("マイクのアクセスが拒否されました", err);
      }
    });
  </script>
</body>
</html>
