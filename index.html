<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>MUKU</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    body { background-color: #000; color: white; margin: 0; overflow: hidden; user-select: none; touch-action: none; }
    
    .eye { transition: all 0.7s ease-in-out; background-color: #f59e0b; border-radius: 50%; }
    .mouth { transition: all 0.7s ease-in-out; stroke: #f59e0b; fill: transparent; stroke-width: 3; stroke-linecap: round; }
    
    /* 各パーツのサイズを厳密に指定（1.5倍） */
    .eye-normal { width: 36px !important; height: 36px !important; }
    .eye-relax { width: 36px !important; height: 9px !important; margin-top: 12px !important; }
    .eye-attention { width: 48px !important; height: 48px !important; }
    .eye-sleepy { width: 36px !important; height: 3px !important; margin-top: 18px !important; opacity: 0.3; background-color: #b45309; }
    .eye-happy { width: 36px !important; height: 18px !important; border-radius: 36px 36px 0 0 !important; margin-top: 9px !important; }
    
    .eye-blink-closed { width: 36px !important; height: 3px !important; margin-top: 16px !important; transition: all 0.1s !important; }
    .eye-blink-open { width: 36px !important; height: 36px !important; transition: all 0.1s !important; }
  </style>
</head>
<body class="h-screen w-screen flex items-center justify-center">

  <button id="start-btn" class="px-4 py-2 border border-amber-500 text-amber-500 rounded-full hover:bg-amber-500 hover:text-black transition flex items-center justify-center">
    ムクを起こす
  </button>

  <div id="muku-face" class="hidden flex-col items-center justify-center gap-9 w-full h-full">
    <div class="flex gap-[60px]">
      <div class="flex items-center justify-center w-12 h-12"><div id="eye-l" class="eye eye-normal"></div></div>
      <div class="flex items-center justify-center w-12 h-12"><div id="eye-r" class="eye eye-normal"></div></div>
    </div>
    <svg width="60" height="30" viewBox="0 0 40 20" class="opacity-70">
      <path id="mouth" class="mouth" d="M 5 5 Q 12 15 20 5 Q 28 15 35 5" />
    </svg>
  </div>

  <script>
    const startBtn = document.getElementById('start-btn');
    const face = document.getElementById('muku-face');
    const eyeL = document.getElementById('eye-l');
    const eyeR = document.getElementById('eye-r');
    const mouth = document.getElementById('mouth');

    let currentEmotion = 'normal';
    let globalAudioContext = null;
    let purrOscillator = null;
    let lfoOscillator = null; 
    let purrGain = null;

    function setEmotion(emotion) {
      if (currentEmotion === emotion) return;
      currentEmotion = emotion;

      eyeL.className = `eye eye-${emotion}`;
      eyeR.className = `eye eye-${emotion}`;

      if (emotion === 'relax') {
        mouth.setAttribute('d', 'M 5 10 Q 12 15 20 10 Q 28 15 35 10');
      } else if (emotion === 'happy') {
        mouth.setAttribute('d', 'M 5 5 Q 20 20 35 5');
      } else {
        mouth.setAttribute('d', 'M 5 5 Q 12 15 20 5 Q 28 15 35 5');
      }
    }

    // --- ゴロゴロ音 ---
    function startPurr() {
      if (!globalAudioContext || purrOscillator) return;
      
      purrOscillator = globalAudioContext.createOscillator();
      purrOscillator.type = 'sawtooth';
      purrOscillator.frequency.value = 35; 

      purrGain = globalAudioContext.createGain();
      purrGain.gain.value = 0.5;

      const filter = globalAudioContext.createBiquadFilter();
      filter.type = 'lowpass';
      filter.frequency.value = 180; 

      lfoOscillator = globalAudioContext.createOscillator();
      lfoOscillator.type = 'sine';
      lfoOscillator.frequency.value = 1.0; 

      const lfoGain = globalAudioContext.createGain();
      lfoGain.gain.value = 0.4; 

      lfoOscillator.connect(lfoGain);
      lfoGain.connect(purrGain.gain);

      purrOscillator.connect(filter);
      filter.connect(purrGain);
      purrGain.connect(globalAudioContext.destination);

      purrOscillator.start();
      lfoOscillator.start();
    }

    function stopPurr() {
      if (purrGain && purrOscillator) {
        purrGain.gain.setValueAtTime(purrGain.gain.value, globalAudioContext.currentTime);
        purrGain.gain.linearRampToValueAtTime(0, globalAudioContext.currentTime + 1.0);
        
        setTimeout(() => {
          if (purrOscillator) {
            purrOscillator.stop();
            purrOscillator.disconnect();
            purrOscillator = null;
          }
          if (lfoOscillator) {
            lfoOscillator.stop();
            lfoOscillator.disconnect();
            lfoOscillator = null;
          }
        }, 1000);
      }
    }

    // --- 撫でるアクションの判定 ---
    let moveCount = 0;
    let petTimer = null;
    let lastEventTime = 0;

    function handlePet(e) {
      const now = Date.now();
      
      if (now - lastEventTime < 30) return;
      lastEventTime = now;

      moveCount++;

      if (moveCount >= 10 && currentEmotion !== 'happy') {
        setEmotion('happy');
      }

      if (moveCount >= 35) {
        startPurr();
      }

      clearTimeout(petTimer);
      petTimer = setTimeout(() => {
        if (currentEmotion === 'happy') {
          setEmotion('normal');
        }
        stopPurr();
        moveCount = 0;
      }, 1000);
    }

    face.addEventListener('touchmove', handlePet, { passive: true });
    face.addEventListener('mousemove', handlePet);

    // --- 起床時のパチクリ ---
    function playWakeUpBlink() {
      let count = 0;
      const blinkInterval = setInterval(() => {
        if (count % 2 === 0) {
          eyeL.className = 'eye eye-blink-closed';
          eyeR.className = 'eye eye-blink-closed';
        } else {
          eyeL.className = 'eye eye-blink-open';
          eyeR.className = 'eye eye-blink-open';
        }
        count++;
        
        if (count >= 4) { 
          clearInterval(blinkInterval);
          setTimeout(() => {
            eyeL.className = `eye eye-${currentEmotion}`;
            eyeR.className = `eye eye-${currentEmotion}`;
          }, 150);
        }
      }, 150);
    }

    // --- 初期化処理 ---
    startBtn.addEventListener('click', async () => {
      startBtn.classList.add('hidden');
      face.classList.remove('hidden');
      face.classList.add('flex');

      playWakeUpBlink();

      let battery = null;
      if ('getBattery' in navigator) {
        battery = await navigator.getBattery();
      }

      try {
        const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
        globalAudioContext = new (window.AudioContext || window.webkitAudioContext)();
        
        const analyser = globalAudioContext.createAnalyser();
        const microphone = globalAudioContext.createMediaStreamSource(stream);
        
        microphone.connect(analyser);
        analyser.fftSize = 256;
        const dataArray = new Uint8Array(analyser.frequencyBinCount);

        setInterval(() => {
          if (currentEmotion === 'happy') return;

          const hour = new Date().getHours();
          analyser.getByteFrequencyData(dataArray);
          const volume = Math.max(...dataArray);

          if (volume > 50) {
            setEmotion('attention');
            setTimeout(() => { if(currentEmotion === 'attention') setEmotion('normal') }, 3000);
          } else if (battery && battery.charging) {
            setEmotion('relax');
          } else if (battery && battery.level <= 0.2 && !battery.charging) {
            setEmotion('sleepy');
          } else if (hour >= 23 || hour < 5) {
            setEmotion('sleepy');
          } else if (currentEmotion !== 'normal' && volume <= 50) {
            setEmotion('normal');
          }
        }, 1000);

      } catch (err) {
        console.error("マイクのアクセスが拒否されました", err);
        alert("ムクが周囲の音を聞くために、マイクの許可が必要です。");
      }
    });
  </script>
</body>
</html>
